name: Smart Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

env:
  # Regression guard for the deployed contract only. Raised from the
  # previous 55000: that limit was never actually enforced (the old
  # check globbed *.wasm, so SIZE held two values and `[` aborted with
  # "too many arguments" — which, as an `if` condition, silently read
  # as false). The contract has since grown to ~94 KB. Hoisted to
  # workflow level so the size-report job below stays in sync with it.
  MAX_WASM_BYTES: "98500"
  # Pinned toolchain used to build the contract spec. Must match the
  # version used to generate the committed TypeScript bindings so the
  # ABI comparison below is deterministic.
  STELLAR_CLI_VERSION: "28.0.0"
  # Committed TypeScript bindings generated from the Soroban interface.
  BINDINGS_DIR: "Dechat/dex_with_fiat_frontend/src/lib/contracts"

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check Cargo.lock is not drifting alone
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- Dechat/stellar-contracts/Cargo.lock Dechat/stellar-contracts/Cargo.toml Dechat/stellar-contracts/**/Cargo.toml)

          if echo "$CHANGED" | grep -q "Cargo.lock" && ! echo "$CHANGED" | grep -q "Cargo.toml"; then
            echo "Error: Dechat/stellar-contracts/Cargo.lock changed without a matching Cargo.toml change."
            echo "Lockfile drift (e.g. from an unpinned transitive dependency bump) must be accompanied by an intentional manifest change, or reverted."
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target

      - name: Run tests
        run: cargo test

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target

      - name: Build WASM release
        run: stellar contract build

      - name: Check WASM size
        run: |
          set -euo pipefail
          ARTIFACT=target/wasm32v1-none/release/stellar_contracts.optimized.wasm

          ls -la target/wasm32v1-none/release/*.wasm

          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: expected contract artifact $ARTIFACT was not produced"
            exit 1
          fi

          SIZE=$(wc -c < "$ARTIFACT" | tr -d '[:space:]')
          echo "Contract WASM size: $SIZE bytes (limit ${MAX_WASM_BYTES})"
          echo "Contract WASM size: \`$SIZE\` bytes (limit \`${MAX_WASM_BYTES}\`)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo "Error: WASM size $SIZE bytes exceeds ${MAX_WASM_BYTES} byte limit"
            exit 1
          fi

  bindings-drift:
    name: Contract Bindings Drift
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target

      - name: Build contract spec from pinned toolchain
        run: stellar contract build

      - name: Generate bindings from current spec
        run: |
          set -euo pipefail
          rm -rf /tmp/generated-bindings
          mkdir -p /tmp/generated-bindings
          stellar contract bindings typescript \
            --wasm target/wasm32v1-none/release/stellar_contracts.optimized.wasm \
            --output-dir /tmp/generated-bindings \
            --overwrite

      - name: Compare generated bindings with committed bindings
        run: |
          set -euo pipefail
          COMMITTED="$GITHUB_WORKSPACE/$BINDINGS_DIR"

          if [ ! -d "$COMMITTED" ]; then
            echo "Error: committed bindings directory $BINDINGS_DIR not found."
            echo "Generate bindings with: stellar contract bindings typescript --wasm <wasm> --output-dir $BINDINGS_DIR --overwrite"
            exit 1
          fi

          # Normalize away volatile metadata (generated timestamps, absolute
          # paths) so only real ABI drift is reported.
          normalize() {
            find "$1" -type f -name '*.ts' -print0 \
              | sort -z \
              | xargs -0 -I{} sh -c 'echo "=== {} ==="; sed -E "s/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z//g; s#$1##g" "{}"'
          }

          normalize /tmp/generated-bindings > /tmp/generated.norm
          normalize "$COMMITTED" > /tmp/committed.norm

          if ! diff -u /tmp/committed.norm /tmp/generated.norm > /tmp/bindings.diff; then
            echo "Error: committed TypeScript bindings are stale or the ABI changed."
            echo "The contract interface (functions, arguments, return types, or error codes)"
            echo "no longer matches $BINDINGS_DIR."
            echo ""
            echo "Regenerate the bindings and commit the result:"
            echo "  stellar contract bindings typescript \\"
            echo "    --wasm Dechat/stellar-contracts/target/wasm32v1-none/release/stellar_contracts.optimized.wasm \\"
            echo "    --output-dir $BINDINGS_DIR --overwrite"
            echo ""
            echo "--- ABI diff (committed vs generated) ---"
            cat /tmp/bindings.diff
            exit 1
          fi

          echo "Committed bindings match the generated contract spec."

      - name: Upload ABI diff artifact
        if: failure()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: contract-abi-diff
          path: /tmp/bindings.diff
          if-no-files-found: ignore

  deny:
    name: License & Advisory Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-deny (licenses & advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Dechat/stellar-contracts/Cargo.toml
          command: check licenses advisories bans sources

  wasm-size-report:
    name: WASM Size Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "head/Dechat/stellar-contracts -> .wasm-size-target"

      - name: Build head WASM
        working-directory: head/Dechat/stellar-contracts
        run: stellar contract build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.wasm-size-target

      - name: Record head size
        id: head_size
        run: |
          SIZE=$(wc -c < "${{ github.workspace }}/.wasm-size-target/wasm32v1-none/release/stellar_contracts.optimized.wasm" | tr -d '[:space:]')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Build base WASM
        working-directory: base/Dechat/stellar-contracts
        run: stellar contract build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.wasm-size-target

      - name: Record base size
        id: base_size
        run: |
          SIZE=$(wc -c < "${{ github.workspace }}/.wasm-size-target/wasm32v1-none/release/stellar_contracts.optimized.wasm" | tr -d '[:space:]')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Write size report
        run: |
          cat > wasm-size-report.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "base_sha": "${{ github.event.pull_request.base.sha }}",
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_size": ${{ steps.base_size.outputs.size }},
            "head_size": ${{ steps.head_size.outputs.size }}
          }
          EOF

      - name: Upload size report
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: wasm-size-report
          path: wasm-size-report.json
