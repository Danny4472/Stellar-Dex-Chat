name: Frontend Build Check

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Create .env.local with placeholder values
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_STELLAR_RPC_URL=https://soroban-testnet.stellar.org
          NEXT_PUBLIC_FIAT_BRIDGE_CONTRACT=CAWYXBN4PSVXD7NIYEWVFFIIIEUCC6PUN3IMG3J2WHKDB4NVIISMXBPR
          NEXT_PUBLIC_XLM_SAC_CONTRACT=CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          NEXT_PUBLIC_GEMINI_API_KEY=PLACEHOLDER
          PAYSTACK_SECRET_KEY=PLACEHOLDER
          PAYOUT_PROVIDER=paystack
          NEXT_PUBLIC_STELLAR_CONTRACT_ID=PLACEHOLDER
          NEXT_PUBLIC_XLM_SAC_ID=PLACEHOLDER
          NEXT_PUBLIC_STELLAR_NETWORK=TESTNET
          GEMINI_API_KEY=PLACEHOLDER
          EOF

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_STELLAR_CONTRACT_ID || 'PLACEHOLDER' }}
          NEXT_PUBLIC_XLM_SAC_ID: ${{ secrets.NEXT_PUBLIC_XLM_SAC_ID || 'PLACEHOLDER' }}
          NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK || 'TESTNET' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER' }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'PLACEHOLDER' }}
          PAYOUT_PROVIDER: ${{ secrets.PAYOUT_PROVIDER || 'paystack' }}

      - name: Generate Node SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format json --output-file sbom-node.cdx.json

      - name: Generate Rust SBOM (CycloneDX)
        run: |
          if [ -f Cargo.lock ]; then
            cargo install cargo-cyclonedx --locked
            cargo cyclonedx --format json --output-cdx
          else
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[],"metadata":{"component":{"type":"application","name":"rust-deps","version":"none"}},"properties":[{"name":"sbom:exception","value":"No Cargo.lock present in repository; Rust dependency inventory not applicable."}]}' > sbom-rust.cdx.json
          fi

      - name: Compute artifact digest
        id: digest
        run: |
          DIGEST=$(find .next -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attach SBOM and provenance to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cat > provenance.json <<EOF
          {
            "sourceRevision": "${{ github.sha }}",
            "workflowIdentity": "${{ github.workflow_ref }}",
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "artifactDigest": "${ARTIFACT_DIGEST}",
            "sbom": ["sbom-node.cdx.json", "sbom-rust.cdx.json"]
          }
          EOF
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom-node.cdx.json sbom-rust.cdx.json provenance.json --clobber

  release-validation:
    name: Release Provenance Validation
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release assets and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release download "$TAG" --pattern 'sbom-*.cdx.json' --pattern 'provenance.json' --dir verify
          test -s verify/sbom-node.cdx.json
          test -s verify/sbom-rust.cdx.json
          test -s verify/provenance.json
          grep -q '"bomFormat"' verify/sbom-node.cdx.json
          grep -q '"bomFormat"' verify/sbom-rust.cdx.json
          grep -q "${{ github.sha }}" verify/provenance.json
          grep -q 'artifactDigest' verify/provenance.json
          echo 'Release SBOM and provenance verified.'
