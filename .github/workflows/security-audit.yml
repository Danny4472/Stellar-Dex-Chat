name: Security Audit

# Advisories against the current lockfiles can surface at any time, not just
# when a contract or frontend PR happens to touch the affected manifest —
# contracts.yml's `deny` job and the frontend build only run on paths that
# touch their respective directories, so a fresh RUSTSEC/npm advisory
# otherwise goes unnoticed until someone edits nearby code. This runs both
# audits weekly regardless of what changed.
#
# Release SBOM/provenance (issue #114): the `release-sbom` job generates
# CycloneDX inventories for the Rust contracts and the Node frontend, records
# the source revision, workflow identity and artifact digests, and attaches
# them to the release. The `release-validation` job independently re-derives
# the digests and verifies the SBOM describes the exact published artifacts.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  contracts-audit:
    name: Contract Advisory Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Dechat/stellar-contracts/Cargo.toml
          command: check advisories

  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  release-sbom:
    name: Generate Release SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate Rust (CycloneDX) SBOM
        working-directory: Dechat/stellar-contracts
        run: cargo cyclonedx --format json --output-pattern package --output-cdx

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Dechat/dex_with_fiat_frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Node (CycloneDX) SBOM
        working-directory: Dechat/dex_with_fiat_frontend
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom-node.cdx.json

      - name: Collect SBOMs and record provenance
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find Dechat/stellar-contracts -name '*.cdx.json' -exec cp {} release-artifacts/ \;
          cp Dechat/dex_with_fiat_frontend/sbom-node.cdx.json release-artifacts/
          {
            echo "source_revision=${GITHUB_SHA}";
            echo "workflow_identity=${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW_REF}";
            echo "release_tag=${{ github.event.release.tag_name }}";
          } > release-artifacts/provenance.txt
          (cd release-artifacts && sha256sum ./*.cdx.json > sbom-digests.txt)
          cat release-artifacts/provenance.txt release-artifacts/sbom-digests.txt

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: release-artifacts/

      - name: Attach SBOM and provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            release-artifacts/*.cdx.json \
            release-artifacts/provenance.txt \
            release-artifacts/sbom-digests.txt \
            --clobber

  release-validation:
    name: Verify Release Provenance
    runs-on: ubuntu-latest
    needs: [release-sbom]
    if: github.event_name == 'release'
    permissions:
      contents: read

    steps:
      - name: Download published SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: release-artifacts

      - name: Verify SBOM digests and provenance
        run: |
          set -euo pipefail
          cd release-artifacts
          # Re-derive digests and confirm they match the recorded manifest.
          sha256sum -c sbom-digests.txt
          # Provenance must reference this exact revision and workflow.
          grep -q "source_revision=${GITHUB_SHA}" provenance.txt
          grep -q "workflow_identity=${GITHUB_REPOSITORY}/" provenance.txt
          # At least one Rust and one Node SBOM must be present.
          ls ./*.cdx.json >/dev/null
          echo "SBOM and provenance verified for ${GITHUB_SHA}"

  open-tracking-issue:
    name: Open Tracking Issue
    runs-on: ubuntu-latest
    needs: [contracts-audit, frontend-audit, secret-inventory]
    if: failure()

    steps:
      - name: Find or create tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'security-audit';
            const title = 'Scheduled security audit failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing[0].number,
                body: `Audit failed again: ${runUrl}`,
              });
              core.notice(`Commented on existing tracking issue #${existing[0].number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner, repo, title, labels: [label],
              body: [
                'The `security-audit.yml` workflow (`cargo deny check advisories`',
                'and/or the pnpm severity policy) failed.',
                '',
                `Failed run: ${runUrl}`,
                '',
                'Close this issue once the advisory has been triaged (ignored with a',
                'documented reason in `Dechat/stellar-contracts/deny.toml`, or fixed by',
                'a dependency bump). Security bumps are not auto-merged; they go through',
                'the normal review and test gates.',
              ].join('\n'),
            });
            core.notice(`Opened tracking issue #${issue.data.number}`);
