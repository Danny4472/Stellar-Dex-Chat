name: Security Audit

# Advisories against the current lockfiles can surface at any time, not just
# when a contract or frontend PR happens to touch the affected manifest —
# contracts.yml's `deny` job and the frontend build only run on paths that
# touch their respective directories, so a fresh RUSTSEC/npm advisory
# otherwise goes unnoticed until someone edits nearby code. This runs on every
# pull request and weekly regardless of what changed.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contracts-audit:
    name: Contract Advisory Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Dechat/stellar-contracts/Cargo.toml
          command: check advisories

  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Severity policy: fail on high/critical. Findings below the threshold are
      # reported but do not block. Time-bounded exceptions live in
      # .github/security-audit-exceptions.json (owner + expiry required).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high --json > pnpm-audit.json || true

      - name: Enforce severity policy and report dependency paths
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const THRESHOLD = 'high';
          const RANK = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };
          const EXCEPTIONS_FILE = path.join(process.env.GITHUB_WORKSPACE, '.github/security-audit-exceptions.json');

          let exceptions = [];
          if (fs.existsSync(EXCEPTIONS_FILE)) {
            exceptions = JSON.parse(fs.readFileSync(EXCEPTIONS_FILE, 'utf8'));
          }

          const now = Date.now();
          const activeExceptions = exceptions.filter((e) => {
            if (!e.owner || !e.expiry) {
              console.error(`Exception for ${e.id} is missing owner or expiry; ignoring.`);
              return false;
            }
            if (Date.parse(e.expiry) < now) {
              console.error(`Exception for ${e.id} expired on ${e.expiry}; ignoring.`);
              return false;
            }
            return true;
          });

          const raw = fs.existsSync('pnpm-audit.json') ? fs.readFileSync('pnpm-audit.json', 'utf8') : '{}';
          let report = {};
          try { report = JSON.parse(raw); } catch { report = {}; }

          const advisories = report.advisories || {};
          const findings = [];

          for (const advisory of Object.values(advisories)) {
            const severity = advisory.severity || 'low';
            if ((RANK[severity] ?? 0) < RANK[THRESHOLD]) continue;

            const moduleName = advisory.module_name;
            const patched = advisory.patched_versions || 'no patched version published';
            const paths = (advisory.findings || []).flatMap((f) => f.paths || []);

            const excepted = activeExceptions.some((e) => e.id === advisory.id || e.id === advisory.github_advisory_id);
            findings.push({ id: advisory.github_advisory_id || advisory.id, moduleName, severity, patched, paths, excepted });
          }

          if (findings.length === 0) {
            console.log('No findings at or above the severity threshold.');
            process.exit(0);
          }

          let blocking = 0;
          for (const f of findings) {
            const status = f.excepted ? 'EXCEPTED' : 'BLOCKING';
            if (!f.excepted) blocking += 1;
            console.log(`[${status}] ${f.id} ${f.moduleName} (${f.severity})`);
            console.log(`  patched version: ${f.patched}`);
            for (const p of f.paths) console.log(`  dependency path: ${p}`);
          }

          if (blocking > 0) {
            console.error(`${blocking} finding(s) at or above '${THRESHOLD}' without a valid exception.`);
            process.exit(1);
          }
          NODE

  secret-inventory:
    name: Secret Inventory & Leak Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Secret inventory: purpose, environment, owner, rotation cadence, and
      # revocation path for each integration credential. Values are NEVER
      # stored here — only metadata. See SECURITY.md for the leak-response
      # procedure (containment, rotation, verification).
      - name: Validate secret inventory metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const INVENTORY_FILE = path.join(process.env.GITHUB_WORKSPACE, '.github/secret-inventory.json');
          const REQUIRED = ['name', 'purpose', 'environment', 'owner', 'rotationCadence', 'revocationPath'];
          const FORBIDDEN_VALUE_KEYS = ['value', 'secret', 'token', 'password', 'key', 'credential'];

          if (!fs.existsSync(INVENTORY_FILE)) {
            console.error('Missing .github/secret-inventory.json');
            process.exit(1);
          }

          let inventory;
          try {
            inventory = JSON.parse(fs.readFileSync(INVENTORY_FILE, 'utf8'));
          } catch (err) {
            console.error(`Invalid JSON in secret inventory: ${err.message}`);
            process.exit(1);
          }

          const entries = Array.isArray(inventory) ? inventory : inventory.secrets || [];
          if (entries.length === 0) {
            console.error('Secret inventory is empty; every integration credential must be tracked.');
            process.exit(1);
          }

          let failures = 0;
          for (const entry of entries) {
            const label = entry.name || '<unnamed>';
            for (const field of REQUIRED) {
              if (!entry[field] || String(entry[field]).trim() === '') {
                console.error(`[${label}] missing required field: ${field}`);
                failures += 1;
              }
            }
            for (const key of Object.keys(entry)) {
              if (FORBIDDEN_VALUE_KEYS.includes(key.toLowerCase())) {
                console.error(`[${label}] inventory must not store secret values (found key: ${key})`);
                failures += 1;
              }
            }
          }

          if (failures > 0) {
            console.error(`${failures} inventory problem(s) found.`);
            process.exit(1);
          }
          console.log(`Secret inventory OK: ${entries.length} credential(s) tracked (metadata only).`);
          NODE

      # Placeholder guard: example env files and logs must use placeholders,
      # never real values. Fails if a committed example env file contains a
      # value that looks like a live credential.
      - name: Guard example env files against real values
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const ROOT = process.env.GITHUB_WORKSPACE;
          const EXAMPLE_PATTERNS = [/\.env\.example$/, /\.env\.sample$/, /\.env\.template$/];
          const PLACEHOLDER_HINTS = ['your-', 'changeme', 'placeholder', 'example', 'xxxx', '<', 'redacted', 'dummy', 'test-'];
          const SUSPICIOUS = [
            /(?:sk|pk)_(?:live|test)_[A-Za-z0-9]{16,}/, // Stripe-style
            /AKIA[0-9A-Z]{16}/, // AWS access key id
            /gh[pousr]_[A-Za-z0-9]{36,}/, // GitHub tokens
            /-----BEGIN [A-Z ]*PRIVATE KEY-----/, // private keys
          ];

          const walk = (dir) => {
            const out = [];
            for (const name of fs.readdirSync(dir)) {
              if (name === 'node_modules' || name === '.git') continue;
              const full = path.join(dir, name);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          };

          const files = walk(ROOT).filter((f) => EXAMPLE_PATTERNS.some((re) => re.test(f)));
          let failures = 0;

          for (const file of files) {
            const rel = path.relative(ROOT, file);
            const lines = fs.readFileSync(file, 'utf8').split('\n');
            lines.forEach((line, i) => {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) return;
              const eq = trimmed.indexOf('=');
              if (eq === -1) return;
              const value = trimmed.slice(eq + 1).trim();
              if (!value) return;
              const looksPlaceholder = PLACEHOLDER_HINTS.some((h) => value.toLowerCase().includes(h));
              const looksReal = SUSPICIOUS.some((re) => re.test(value));
              if (looksReal && !looksPlaceholder) {
                console.error(`${rel}:${i + 1} appears to contain a real value; use a placeholder.`);
                failures += 1;
              }
            });
          }

          if (failures > 0) {
            console.error(`${failures} example env value(s) look like real credentials.`);
            process.exit(1);
          }
          console.log(`Placeholder guard OK: checked ${files.length} example env file(s).`);
          NODE

  open-tracking-issue:
    name: Open Tracking Issue
    runs-on: ubuntu-latest
    needs: [contracts-audit, frontend-audit, secret-inventory]
    if: failure()

    steps:
      - name: Find or create tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'security-audit';
            const title = 'Scheduled security audit failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing[0].number,
                body: `Audit failed again: ${runUrl}`,
              });
              core.notice(`Commented on existing tracking issue #${existing[0].number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner, repo, title, labels: [label],
              body: [
                'The `security-audit.yml` workflow (`cargo deny check advisories`',
                'and/or the pnpm severity policy) failed.',
                '',
                `Failed run: ${runUrl}`,
                '',
                'Close this issue once the advisory has been triaged (ignored with a',
                'documented reason in `Dechat/stellar-contracts/deny.toml`, or fixed by',
                'a dependency bump). Security bumps are not auto-merged; they go through',
                'the normal review and test gates.',
              ].join('\n'),
            });
            core.notice(`Opened tracking issue #${issue.data.number}`);
