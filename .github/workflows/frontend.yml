name: Frontend CI

# ── Job graph ────────────────────────────────────────────────────────────────
#
#   lint ──────────────────────────────────────────────────────────┐
#   build ─────────────────────────────────────────────────────────┤──► e2e
#   unit-tests (matrix ×4, parallel) ──► coverage-merge ──────────┘
#
# build and unit-tests are independent: a test failure does not hide a build
# failure and vice-versa.  e2e waits only for build + lint so it starts as
# soon as the app compiles, without waiting for unit tests.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"

permissions:
  contents: read

# Shared env block referenced by build, unit-tests and e2e.
env:
  NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_STELLAR_CONTRACT_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_XLM_SAC_ID: ${{ secrets.NEXT_PUBLIC_XLM_SAC_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
  NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK || 'TESTNET' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER' }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'PLACEHOLDER' }}
  PAYOUT_PROVIDER: ${{ secrets.PAYOUT_PROVIDER || 'paystack' }}

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Prettier check
        run: pnpm check

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

  # ── 2. Next.js build (independent of unit tests) ──────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  # ── 3. Unit tests — 4 shards run in parallel ──────────────────────────────
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      # Let all shards finish so we always collect all blob artifacts even when
      # one shard has failures — coverage-merge needs every blob.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          pnpm vitest run \
            --coverage \
            --maxWorkers=1 \
            --pool=forks \
            --no-file-parallelism \
            --reporter=blob \
            --reporter=dot \
            --coverage.reporter=json-summary \
            --coverage.clean \
            --shard=${{ matrix.shard }}/4
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Upload the vitest blob so coverage-merge can reconstruct full coverage.
      # The blob lands in .vitest-reports/ by vitest convention.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/.vitest-reports/
          retention-days: 1

      # Upload per-shard coverage-summary.json so coverage-merge has something
      # to work with even if --mergeReports fails.
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/coverage/coverage-summary.json
          retention-days: 1

  # ── 4. Merge coverage blobs, produce report, write job summary ────────────
  coverage-merge:
    name: Coverage merge & report
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run when shards finish (pass or fail) so we always produce coverage data.
    # Skip only if the unit-tests job itself was skipped (e.g. path filter).
    if: needs.unit-tests.result != 'skipped'

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # Download all four blob artifacts into .vitest-reports/ so vitest can
      # find them with its default --mergeReports path.
      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-blob-*
          path: Dechat/dex_with_fiat_frontend/.vitest-reports
          merge-multiple: true

      - name: Merge reports and regenerate coverage
        run: |
          pnpm vitest run \
            --mergeReports \
            --coverage \
            --reporter=default
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # NOTE: coverage.thresholds are not configured in vitest.config.ts yet.
        # The numbers below (stmt 70%, branch 65%, fn 70%, lines 70%) are targets
        # only; this step does not fail on low coverage until thresholds are added.

      # Build the JSON consumed by coverage-comment.yml.
      - name: Generate coverage report artifact
        id: coverage_report
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const report = {
              pr_number: ${{ github.event.pull_request.number }},
              head_sha: '${{ github.event.pull_request.head.sha }}',
              generated: true,
              total: {
                statements: total.statements.pct,
                branches: total.branches.pct,
                functions: total.functions.pct,
                lines: total.lines.pct
              }
            };
            fs.writeFileSync('coverage-report.json', JSON.stringify(report, null, 2));
          "
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always() && steps.coverage_report.outputs.generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: Dechat/dex_with_fiat_frontend/coverage-report.json
          retention-days: 5

  # ── 5. Accessibility checks on critical frontend paths ────────────────────
  # Runs axe-core against representative route/component states (transaction
  # dialogs, wallet states, chat, admin views), including error states and
  # modal focus. Fails on serious/critical violations. Suppressions must be
  # declared with an owner and an expiry in a11y-suppressions.json; blanket
  # route/component exclusions are rejected by the checker.
  accessibility:
    name: Accessibility checks
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Validate a11y suppressions (owner + expiry required)
        run: pnpm exec tsx scripts/check-a11y-suppressions.ts

      - name: Run accessibility checks
        run: pnpm test:a11y
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-report
          path: Dechat/dex_with_fiat_frontend/a11y-report/
          retention-days: 5
